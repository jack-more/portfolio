<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ballast Beach</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;800&family=Geist+Mono:wght@500&display=swap">
<style>
  @font-face{font-family:"Ballast Display";src:url(/notes/BallastDisplay-BlackItalic.woff2) format("woff2");font-display:swap}
  /* brand colours: Honolulu blue and solar orange */
  :root{--ink:#0A0D18;--honolulu:#0076B6;--honolulu-dk:#00507D;--orange:#F86608;--sun:#FFD84D;--g:"Geist","Helvetica Neue",Arial,sans-serif;--m:"Geist Mono",ui-monospace,monospace;--d:"Ballast Display",var(--g)}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:#fff;font-family:var(--g)}

  /* header: links only, soft white pill (same as ballast.la) */
  .nav{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:50;display:flex;gap:clamp(22px,3.2vw,46px);padding:13px clamp(22px,2.6vw,34px);background:rgba(254,253,248,.93);-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);border-radius:999px;box-shadow:0 0 18px 10px rgba(255,255,255,.72),0 0 48px 22px rgba(255,255,255,.28)}
  .nav a{position:relative;font:500 15px/1 var(--m);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);padding:6px 2px;text-decoration:none}
  .nav a::before,.nav a::after{content:"";position:absolute;width:5px;height:5px;opacity:0;transition:opacity .15s}
  .nav a::before{left:-7px;top:-5px;border-left:1.5px solid #B6E61E;border-top:1.5px solid #B6E61E}
  .nav a::after{right:-7px;bottom:-5px;border-right:1.5px solid #B6E61E;border-bottom:1.5px solid #B6E61E}
  .nav a:hover::before,.nav a:hover::after{opacity:1}

  .hero{position:relative;height:100svh;min-height:640px;overflow:hidden;isolation:isolate;background:#1a7fd0;cursor:pointer;user-select:none}
  .hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1}

  /* title block lives in the open sky, top left */
  .title{position:absolute;left:clamp(20px,5vw,84px);top:clamp(100px,16vh,160px);width:min(560px,44vw)}
  .title img{width:clamp(240px,25vw,430px);display:block;filter:drop-shadow(0 6px 0 rgba(0,60,100,.35)) drop-shadow(0 18px 30px rgba(0,60,100,.35));animation:logo 3.4s ease-in-out infinite;transform-origin:30% 70%}
  .title img.boing{animation:boing .7s cubic-bezier(.3,1.6,.5,1)}
  @keyframes logo{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1deg)}}
  @keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.12,.9)}60%{transform:scale(.95,1.06)}100%{transform:scale(1)}}
  .title h1{margin:20px 0 0;font-weight:800;letter-spacing:-.035em;line-height:1.02;font-size:clamp(26px,2.5vw,44px);text-shadow:0 2px 0 rgba(0,60,100,.4),0 8px 26px rgba(0,60,100,.4)}

  /* press start sits centred low in the sky, like a title screen */
  .start{display:inline-block;margin-top:26px;text-decoration:none;color:#fff}
  .start b{display:block;font:italic 900 clamp(24px,2.3vw,38px)/1 var(--d);letter-spacing:.03em;text-transform:uppercase;text-shadow:3px 3px 0 var(--orange),0 0 24px rgba(255,255,255,.4);animation:blink 1.1s steps(1) infinite}
  .start span{display:inline-block;margin-top:10px;font:500 13px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;background:rgba(0,118,182,.85);padding:7px 10px;border-radius:999px}
  .start:hover b{animation:none}
  @keyframes blink{0%,62%{opacity:1}63%,100%{opacity:.12}}

  /* scores float in the water between Bally's hands */
  .hud{position:absolute;left:50%;bottom:clamp(22px,5vh,52px);transform:translateX(-50%);display:flex;gap:clamp(22px,3vw,52px);align-items:flex-end;z-index:3}
  .hud div{text-align:center;animation:bob 4.4s ease-in-out infinite}
  .hud div:nth-child(2){animation-delay:-1.4s;animation-duration:5s}
  .hud div:nth-child(3){animation-delay:-2.8s;animation-duration:4.7s}
  .hud span{display:block;font:500 13px/1 var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--sun);text-shadow:0 1px 0 var(--honolulu-dk),1px 0 0 var(--honolulu-dk),-1px 0 0 var(--honolulu-dk),0 -1px 0 var(--honolulu-dk),0 0 10px rgba(0,60,100,.7)}
  .hud b{display:block;margin-top:6px;font:italic 900 clamp(34px,3.3vw,58px)/1 var(--d);color:#fff;-webkit-text-stroke:2px var(--honolulu-dk);paint-order:stroke fill;text-shadow:4px 4px 0 var(--honolulu-dk),0 10px 24px rgba(0,60,100,.45)}
  .hud i{font-style:normal}.hud .s{display:none}
  .hud em{display:block;margin-top:6px;font:500 13px/1 var(--g);font-style:normal;text-shadow:0 1px 6px rgba(0,60,100,.8)}
  .hud div.pop b{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-.8deg)}50%{transform:translateY(-10px) rotate(.8deg)}}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

  /* idle: sparkles on the water, bubbles from the hands */
  .spark{position:absolute;width:18px;height:18px;z-index:2;pointer-events:none;background:radial-gradient(closest-side,#fff,rgba(255,255,255,0));clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);animation:twinkle 2.6s ease-in-out infinite;opacity:0}
  @keyframes twinkle{0%,100%{transform:scale(.2) rotate(0);opacity:0}45%{transform:scale(1) rotate(45deg);opacity:1}}
  .bub{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(255,255,255,.18);z-index:2;pointer-events:none;animation:rise linear forwards}
  @keyframes rise{to{transform:translateY(-34vh) translateX(var(--dx));opacity:0}}
  /* click: splash rings and droplets */
  .ring{position:absolute;border:3px solid rgba(255,255,255,.9);border-radius:50%;transform:translate(-50%,-50%) scaleY(.35);pointer-events:none;z-index:2;animation:ring .9s ease-out forwards}
  @keyframes ring{from{width:10px;height:10px;opacity:1}to{width:220px;height:220px;opacity:0}}
  .drop{position:absolute;width:9px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#e9fbff;pointer-events:none;z-index:2;animation:drop .8s cubic-bezier(.2,.6,.4,1) forwards}
  @keyframes drop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
  .flash{position:fixed;inset:0;background:#fff;z-index:99;pointer-events:none;animation:flash .5s ease-out forwards}
  @keyframes flash{from{opacity:1}to{opacity:0}}

  @media (max-width:760px){
    .nav{top:12px;gap:18px;padding:11px 18px}.nav a{font-size:13px;letter-spacing:.04em}
    .title{top:78px;width:auto;right:20px}
    .title img{width:150px}
    .title h1{margin-top:10px;font-size:20px;max-width:300px}
    .start{margin-top:14px}
    .start b{font-size:22px}
    .start span{margin-top:8px}
    .hud{gap:18px;left:12px;right:12px;transform:none;justify-content:center;bottom:26px}
    .hud .l,.hud em{display:none}.hud .s{display:inline}
    .hud span{font-size:12px}.hud b{font-size:26px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<nav class="nav"><a href="/#work">Work</a><a href="/#sports">Sports</a><a href="/#rd">Services</a><a href="/notes/">Notes</a></nav>

<section class="hero" id="game">
  <canvas data-src="beach-3d.webp?v=3" data-line="0.66" data-focus="0.56"></canvas>
  <div class="title">
    <img src="/lockup.png?v=5" alt="Ballast">
    <h1>Your partner in performance marketing + growth.</h1>
    <a class="start" href="/#book"><b>Press start</b><span>Book a call</span></a>
  </div>
  <div class="hud">
    <div><span><i class="l">Ad spend managed</i><i class="s">Ad spend</i></span><b data-n="50" data-pre="$" data-post="M+">$50M+</b></div>
    <div><span><i class="l">DTC sales a month</i><i class="s">DTC sales/mo</i></span><b>$10K→$1.2M+</b></div>
    <div><span><i class="l">Blended ROAS</i><i class="s">ROAS</i></span><b data-n="4" data-post="×">4×</b><em>at $2M+ a month</em></div>
  </div>
</section>

<script>
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hero = document.getElementById('game'), cv = hero.querySelector('canvas');

// ---- water: frame bobs like treading water, everything below the waterline ripples,
// the store windows glow, the pole sign hums, the camera drifts toward the cursor,
// and a click sends a ripple out across the water
const VS = `attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0,1);}`;
const FS = `precision mediump float;varying vec2 v;uniform sampler2D img;uniform float t,line,ct;uniform vec2 scale,off,look,cp;
void main(){
  vec2 uv=vec2(v.x,1.-v.y);
  uv.y+=sin(t*.9)*.007+sin(t*.37)*.003;
  uv.x+=sin(t*.5)*.002;
  uv=(uv-.5)*scale+.5+off+look;
  float m=smoothstep(line-.005,line+.05,uv.y), d=uv.y-line;
  uv.x+=m*(sin(uv.y*90.-t*2.2)*.001+sin(uv.y*31.+t*1.3)*.0013)*(.5+d*3.);
  uv.y+=m*(cos(uv.x*50.+t*1.7)*.0009)*(.5+d*3.);
  // click ripple
  float age=t-ct; if(age<2.5&&age>0.){ vec2 q=(uv-cp)*vec2(1.,2.6); float r=length(q), w=age*.32;
    uv+=normalize(q+1e-5)*sin((r-w)*90.)*.006*exp(-abs(r-w)*30.)*exp(-age*1.4)*m; }
  vec3 c=texture2D(img,uv).rgb;
  c+=m*pow(max(0.,sin(uv.x*80.+t*1.9)*sin(uv.y*70.-t*1.3)),8.)*.2;                       // glints
  float win=smoothstep(.49,.52,uv.x)*smoothstep(.77,.74,uv.x)*smoothstep(.46,.49,uv.y)*smoothstep(.63,.6,uv.y);
  float lum=dot(c,vec3(.3,.59,.11));
  c+=win*smoothstep(.55,.85,lum)*(.05+.05*sin(t*1.6))*vec3(1.,.93,.7);                        // shop lights breathe
  gl_FragColor=vec4(c,1.);
}`;
const gl = cv.getContext('webgl');
let U, T = 0, clickT = -10, look = [0, 0], lookT = [0, 0];
if (gl) {
  const sh = (k, s) => { const o = gl.createShader(k); gl.shaderSource(o, s); gl.compileShader(o); return o; };
  const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  U = n => gl.getUniformLocation(pr, n);
  const img = new Image(); img.src = cv.dataset.src;
  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T].forEach(k => gl.texParameteri(gl.TEXTURE_2D, k, gl.CLAMP_TO_EDGE));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.uniform1f(U('line'), +cv.dataset.line); gl.uniform1f(U('ct'), -10);
    let on = true; new IntersectionObserver(e => on = e[0].isIntersecting).observe(cv);
    const fit = () => {
      const dpr = Math.min(devicePixelRatio, 1.5), w = cv.clientWidth, h = cv.clientHeight;
      cv.width = w * dpr; cv.height = h * dpr; gl.viewport(0, 0, cv.width, cv.height);
      const ca = w / h, ia = img.width / img.height, s = .965;
      const sx = ca > ia ? s : s * ca / ia, sy = ca > ia ? s * ia / ca : s;
      const fx = +cv.dataset.focus || .5, ox = Math.max(-(1 - sx) / 2, Math.min((1 - sx) / 2, fx - .5));
      gl.uniform2f(U('scale'), sx, sy); gl.uniform2f(U('off'), ox, 0);
      fit.sx = sx; fit.sy = sy; fit.ox = ox;
    };
    fit(); addEventListener('resize', fit); window._fit = fit;
    const draw = ms => {
      T = ms / 1000;
      look[0] += (lookT[0] - look[0]) * .05; look[1] += (lookT[1] - look[1]) * .05;
      if (on) { gl.uniform1f(U('t'), still ? 0 : T); gl.uniform2f(U('look'), look[0], look[1]); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }
      if (!still) requestAnimationFrame(draw);
    };
    requestAnimationFrame(draw);
  };
}

// camera drifts slightly toward the cursor
hero.addEventListener('pointermove', e => {
  const r = hero.getBoundingClientRect();
  lookT = [((e.clientX - r.left) / r.width - .5) * .012, ((e.clientY - r.top) / r.height - .5) * .008];
});

// click: ripple in the shader, a splash ring and droplets where you clicked
hero.addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const r = hero.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  if (gl && window._fit) {
    const f = window._fit, u = (x / r.width - .5) * f.sx + .5 + f.ox + look[0], v = (y / r.height - .5) * f.sy + .5 + look[1];
    gl.uniform2f(U('cp'), u, v); gl.uniform1f(U('ct'), T); clickT = T;
  }
  const ring = document.createElement('i'); ring.className = 'ring'; ring.style.left = x + 'px'; ring.style.top = y + 'px'; hero.append(ring); setTimeout(() => ring.remove(), 1000);
  for (let i = 0; i < 9; i++) {
    const d = document.createElement('i'); d.className = 'drop'; d.style.left = x + 'px'; d.style.top = y + 'px';
    const ang = -Math.PI / 2 + (Math.random() - .5) * 2.2, sp = 50 + Math.random() * 70;
    d.style.setProperty('--dx', Math.cos(ang) * sp + 'px'); d.style.setProperty('--dy', Math.sin(ang) * sp + 30 + 'px'); d.style.setProperty('--r', (Math.random() * 90 - 45) + 'deg');
    hero.append(d); setTimeout(() => d.remove(), 900);
  }
});

// logo boings when clicked; stats pop when clicked
const logo = hero.querySelector('.title img');
logo.addEventListener('click', e => { e.stopPropagation(); logo.classList.remove('boing'); void logo.offsetWidth; logo.classList.add('boing'); });
logo.addEventListener('animationend', () => logo.classList.remove('boing'));
hero.querySelectorAll('.hud div').forEach(dv => dv.addEventListener('click', e => { e.stopPropagation(); dv.classList.remove('pop'); void dv.offsetWidth; dv.classList.add('pop'); }));

// press start: white flash, then go
hero.querySelector('.start').addEventListener('click', e => {
  if (still) return; e.preventDefault(); const href = e.currentTarget.href;
  const f = document.createElement('div'); f.className = 'flash'; document.body.append(f); setTimeout(() => location.href = href, 260);
});

// stats count up when the screen loads
if (!still) hero.querySelectorAll('[data-n]').forEach(el => {
  const end = +el.dataset.n, t0 = performance.now();
  const step = now => { const k = Math.min(1, (now - t0) / 1300), n = Math.round(end * (1 - Math.pow(1 - k, 3)));
    el.textContent = (el.dataset.pre || '') + n + (el.dataset.post || ''); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
});

// idle: sparkles twinkle on the water, bubbles rise from Bally's hands
if (!still) {
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('i'); s.className = 'spark';
    s.style.left = (4 + Math.random() * 92) + '%'; s.style.top = (68 + Math.random() * 28) + '%';
    s.style.animationDelay = (-Math.random() * 2.6) + 's'; s.style.animationDuration = (2 + Math.random() * 1.6) + 's';
    const k = .6 + Math.random() * .9; s.style.width = s.style.height = 18 * k + 'px'; hero.append(s);
  }
  const bubble = () => {
    const b = document.createElement('i'); b.className = 'bub'; const sz = 6 + Math.random() * 12;
    const side = Math.random() < .5 ? .2 : .8;   // near each hand
    b.style.left = (side * 100 + (Math.random() - .5) * 10) + '%'; b.style.width = b.style.height = sz + 'px';
    b.style.setProperty('--dx', (Math.random() - .5) * 40 + 'px'); b.style.animationDuration = (2.4 + Math.random() * 1.8) + 's';
    hero.append(b); setTimeout(() => b.remove(), 4400);
  };
  setInterval(bubble, 520);
}
</script>
</body>
</html>
