<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Ballast · Draft B</title><link rel="icon" href="/favicon.ico?v=3">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono&display=swap">
<style>
/* Draft B, immersive: one big window playing the real spots, cursor smoke over it, snappy motion. */
:root{--bg:#EEF0F6;--ink:#0B0F19;--mute:#646B7A;--line:rgba(11,15,25,.14);--orange:#F85800;--pad:clamp(18px,3.6vw,56px);--e:cubic-bezier(.2,.9,.1,1)}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font-family:Geist,system-ui,sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}.mono{font-family:'Geist Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.wrap{padding-left:var(--pad);padding-right:var(--pad)}
.top{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,6fr) minmax(0,3fr);gap:24px;align-items:start;padding-top:28px;padding-bottom:26px}
.top img{height:32px;display:block}
.top h1{font-weight:400;font-size:clamp(24px,2.35vw,40px);line-height:1.1;letter-spacing:-.03em}
.top h1 .l{display:block;overflow:hidden}.top h1 .l span{display:block;transform:translateY(110%);animation:up .8s var(--e) forwards}
.top h1 .l:nth-child(2) span{animation-delay:.06s}.top h1 .l:nth-child(3) span{animation-delay:.12s}
@keyframes up{to{transform:none}}
.pills{justify-self:end;display:flex;gap:10px}
.pill{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 22px;border-radius:999px;background:#E1E4EC;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.pill.dark{background:var(--ink);color:#fff}.pill.dark i{width:6px;height:6px;border-radius:50%;background:var(--orange)}
.roll{position:relative;display:inline-block;overflow:hidden;height:1.3em;line-height:1.3em}.roll b{display:block;font-weight:inherit;transition:transform .5s var(--e)}
.pill:hover .roll b{transform:translateY(-100%)}
.win{position:relative;height:min(calc(100svh - 200px),780px);min-height:360px;border-radius:20px;overflow:hidden;background:#0B0F19;clip-path:inset(6% 6% 6% 6% round 20px);animation:open 1.1s .25s var(--e) forwards}
@keyframes open{to{clip-path:inset(0 0 0 0 round 20px)}}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 40%;transform:scale(1.06);animation:push 14s linear forwards}@keyframes push{to{transform:scale(1)}}
.yt{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s}.yt.on{opacity:1}
.yt iframe{position:absolute;top:50%;left:50%;width:max(100%,177.78vh);height:max(100%,56.25vw);transform:translate(-50%,-50%) scale(1.18);border:0}
.win::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,15,25,0) 60%,rgba(11,15,25,.45));pointer-events:none}
canvas.smoke{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.cap{position:absolute;left:22px;bottom:20px;z-index:3;color:#fff;display:flex;gap:12px;align-items:baseline;font-size:15px}
.cap b{font-weight:500}.cap span{opacity:.75}
.sound{position:absolute;right:20px;bottom:16px;z-index:3;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:10px 16px;font:inherit;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(8px)}
.marks{display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-size:20px;font-weight:300}
.after{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,6fr);gap:32px;padding-top:80px;padding-bottom:120px;align-items:end}
.after h2{font-weight:400;font-size:clamp(40px,5vw,80px);letter-spacing:-.045em;line-height:.98}
.after .nums{display:flex;gap:40px;justify-self:end}.after b{display:block;font-weight:400;font-size:clamp(34px,3vw,52px);letter-spacing:-.04em;line-height:1}.after span{font-size:14px;color:var(--mute)}
@media(max-width:860px){.top{grid-template-columns:1fr auto}.top h1{grid-column:1/-1;grid-row:2;font-size:24px}.pill:not(.dark){display:none}.win{height:64svh}.after{grid-template-columns:1fr}.after .nums{justify-self:start;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){.top h1 .l span{animation:none;transform:none}.win{animation:none;clip-path:none}}
</style>
<script src="https://www.youtube.com/iframe_api" async></script></head><body>
<header class="top wrap"><a href="/"><img src="/lockup.png?v=2" alt="Ballast"></a>
  <h1><span class="l"><span>We run paid media, creative and creators</span></span><span class="l"><span>for brands that want growth</span></span><span class="l"><span>they can prove.</span></span></h1>
  <div class="pills"><a class="pill dark" href="/#book"><span class="roll"><b>Book a call</b><b>Book a call</b></span><i></i></a><a class="pill" href="#more"><span class="roll"><b>Menu</b><b>Menu</b></span></a></div></header>
<section class="wrap">
  <div class="win" id="win"><img class="poster" id="poster" src="/preview/b/poster.webp" alt=""><div class="yt" id="ytw"><div id="yt"></div></div><canvas class="smoke" id="smoke"></canvas>
    <div class="cap"><b id="capB">Toyota</b><span id="capS">4Runner</span></div><button class="sound" id="sound" type="button">Sound off</button></div>
  <div class="marks" aria-hidden="true"><i>+</i><i>+</i><span class="mono">Scroll to explore</span><i>+</i><i>+</i></div>
</section>
<section class="after wrap" id="more"><h2>Scale what&rsquo;s worth running.</h2>
  <div class="nums"><div><b>$2M+</b><span>monthly spend at peak</span></div><div><b>6&times;</b><span>peak ROAS</span></div><div><b>$1.2M+</b><span>monthly sales, one client</span></div></div></section>
<script>
const SPOTS=[['oqxAJKy0ii4','Netflix','Squid Game'],['Y_IuBEtfzGM','Toyota','4Runner'],['TcMBFSGVi1c','Disney','Avengers: Endgame'],['6K0o-VQpIXU','NEAR × SailGP','Spain highlights'],['HZ7PAyCDwEg','Universal','Hobbs & Shaw'],['ndl1W4ltcmg','Netflix','The Witcher']];
let player;
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('yt',{videoId:SPOTS[0][0],host:'https://www.youtube-nocookie.com',
  playerVars:{autoplay:1,mute:1,controls:0,disablekb:1,fs:0,iv_load_policy:3,modestbranding:1,playsinline:1,rel:0,loop:1,playlist:SPOTS.map(s=>s[0]).join(',')},
  events:{onReady:e=>{e.target.mute();e.target.playVideo()},onError:()=>{},onStateChange:e=>{if(e.data===1)document.getElementById('ytw').classList.add('on');const id=(player.getVideoData()||{}).video_id,s=SPOTS.find(x=>x[0]===id);
    if(s){document.getElementById('capB').textContent=s[1];document.getElementById('capS').textContent=s[2]}}}})};
document.getElementById('sound').onclick=e=>{if(!player)return;if(player.isMuted()){player.unMute();e.target.textContent='Sound on'}else{player.mute();e.target.textContent='Sound off'}};
</script>
<script type="module">
import {smoke} from '/preview/fluid.js';
const c=document.getElementById('smoke');
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){const s=smoke(c,{target:document.getElementById('win'),color:[1,1,1],opacity:.4});
  if(s){let t=0;const demo=()=>{if(t>60)return;const a=t/60*Math.PI*1.6;s.splat(.3+t/60*.4,.45+Math.sin(a)*.12,.009,Math.cos(a)*.005);t++;requestAnimationFrame(demo)};setTimeout(demo,1400)}}
</script>
</body></html>
