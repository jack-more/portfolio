<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Services · Ballast (preview)</title>
<link rel="icon" href="/favicon.ico?v=3">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
@font-face{font-family:BD;src:url(BallastDisplay-BlackItalic.woff2) format('woff2');font-display:swap}
:root{--bg:#EEF2FB;--card:#FFFFFF;--ink:#0B1220;--mute:#5D6678;--line:rgba(11,18,32,.12);--cobalt:#0858F0;--orange:#F85800;--pad:clamp(16px,3vw,48px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Geist,system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
.mono{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase}

/* nav, as on the site: small logo, plain links, one orange button */
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px var(--pad);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.nav img{height:34px;display:block}
.nav nav{display:flex;gap:28px;font-size:15px}
.nav nav a{text-decoration:none;color:var(--mute)}.nav nav a[aria-current]{color:var(--ink)}
.go{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;text-decoration:none;font-weight:500;font-size:15px;padding:10px 18px;border-radius:999px}

/* section head, Motto-style: plain headline between hairlines */
.head{padding:clamp(48px,9vh,110px) var(--pad) clamp(28px,5vh,56px)}
.head .rule{border-top:1px solid var(--line)}
.head h2{font-family:BD,sans-serif;font-weight:400;font-size:clamp(56px,10vw,150px);line-height:.9;letter-spacing:-.01em;padding:18px 0 22px;color:var(--ink)}
.head .sub{display:flex;justify-content:space-between;gap:24px;align-items:flex-end;padding-top:16px;border-top:1px solid var(--line)}
.head .sub p{max-width:44ch;color:var(--mute);font-size:19px}

/* the stack, Kota-style: each card sticks a little lower than the last */
.stack{padding:0 var(--pad) 18vh}
.card{position:sticky;top:calc(84px + var(--i) * 12px);height:min(calc(100vh - 210px),600px);margin-bottom:8vh;overflow:hidden;
  background:var(--card);border-radius:28px;padding:clamp(24px,3.4vw,52px);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,4vw,64px);
  box-shadow:0 -1px 0 var(--line),0 30px 60px -40px rgba(11,18,32,.35);transform-origin:50% 0}
.card .n{color:var(--cobalt)}
.card h3{font-family:BD,sans-serif;font-weight:400;font-size:clamp(36px,4vw,62px);line-height:.95;margin:14px 0 18px;color:var(--ink)}
.card .lead{font-size:clamp(18px,1.5vw,22px);font-weight:500;max-width:30ch;margin-bottom:14px}
.card .body{color:var(--mute);max-width:44ch}
.card .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.card .tags span{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--mute)}
.card .proof{margin-top:auto;padding-top:28px;display:flex;align-items:baseline;gap:14px;border-top:1px solid var(--line)}
.card .proof b{font-family:BD,sans-serif;font-weight:400;font-size:clamp(34px,3.4vw,52px);color:var(--cobalt);line-height:1}
.card .proof span{color:var(--mute);font-size:15px;max-width:26ch}
.card .txt{display:flex;flex-direction:column}
.card a.more{margin-top:20px;align-self:flex-start;font-weight:500;text-underline-offset:5px}

/* the work: real ad thumbnails, a tall one and two short ones */
.work{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;min-height:0}
.work figure{position:relative;border-radius:16px;overflow:hidden;background:#dfe5f2}
.work figure:first-child{grid-row:1/3}
.work img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.card:hover .work img{transform:scale(1.03)}
.work figcaption{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500}

.end{padding:12vh var(--pad);text-align:center}
.end p{font-family:BD,sans-serif;font-size:clamp(36px,5vw,72px);line-height:1;margin-bottom:28px}

@media (max-width:860px){
  .nav nav{display:none}
  .card{grid-template-columns:1fr;top:calc(76px + var(--i) * 8px);height:auto;overflow:visible;padding:22px}
  .work{height:300px}
  .head .sub{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){.card{position:relative;top:auto}}
</style></head><body>

<header class="nav">
  <a href="/"><img src="/lockup.png?v=2" alt="Ballast"></a>
  <nav><a href="/#work">Work</a><a href="#" aria-current="page">Services</a><a href="/#pricing">Pricing</a><a href="/notes/">Notes</a></nav>
  <a class="go" href="/#book">Book a call</a>
</header>

<section class="head">
  <div class="rule"></div>
  <h2>Services</h2>
  <div class="sub"><p>Nine things we run for brands that want to grow on sales they can prove.</p><span class="mono">09 services · Los Angeles</span></div>
</section>

<section class="stack" id="stack"></section>

<section class="end"><p>Not sure which you need?</p><a class="go" href="/#book">Book a free numbers review</a></section>

<script>
const S=[
 ['Media strategy','A plan tied to sales.','What each channel is for, what it gets and when it gets cut. Built from your margins and break-even ROAS.',['Channel mix','Budgets','Break-even ROAS'],['6×','Peak ROAS for a DTC client'],[['/work/brands/toyota-4runner.webp','Toyota · 4Runner'],['/work/yt/oqxAJKy0ii4.webp','Netflix · Squid Game'],['/work/yt/jtJ_DbPYnrU.webp','Starbucks · Holidays']]],
 ['Paid media','Meta, TikTok, Google, YouTube, programmatic and CTV.','Tested every week and reported against revenue, not platform dashboards.',['Meta','TikTok','Google','YouTube','CTV'],['$1.2M+','A month in sales for a health and wellness brand'],[['/work/health/ads/sko-founder-1.webp','Founder ad'],['/work/yt/TcMBFSGVi1c.webp','Disney · Avengers'],['/work/brands/toyota-tacoma.webp','Toyota · Tacoma']]],
 ['Live shopping','TikTok LIVE that sells.','We set up the shop, cast and train the hosts, write the run of show and build offers that close in the chat.',['TikTok Shop','Hosts','Run of show'],['$5K','A day in sales from TikTok LIVE'],[['/work/health/ads/ugc-ethan-restock-1.webp','Live restock'],['/work/health/ads/ugc-hanna-1.webp','Host'],['/work/health/ads/sko-orders.webp','Orders']]],
 ['Creators and UGC','Creators, paid on what they sell.','Recruited, briefed and paid on sales, so the best ones scale and the rest cost nothing. Their posts become your ads.',['Recruiting','Briefs','Paid on sales'],['30+','Creators onboarded and paid on sales'],[['/work/health/ads/ugc-ethan-1.webp','Creator'],['/work/health/ads/ugc-dennis-1.webp','Creator'],['/work/health/ads/ugc-tyler-1.webp','Creator']]],
 ['Measurement','One number per goal, matched to real orders.','Tracking checked end to end and reconciled with your store. You see what spend actually creates.',['Tracking audit','Store data','True CAC'],['2×+','The gap one platform claimed over provable sales'],[['/work/health/ads/sko-dna.webp','Ad'],['/work/health/ads/sko-hightech.webp','Ad'],['/work/health/ads/sko-truck.webp','Ad']]],
 ['Creative','New hooks every week.','Cut from what is already winning, made for each platform and written to pass ad review the first time.',['Hooks','Edits','Platform cuts'],['Weekly','New creative, every week'],[['/work/health/ads/sko-frutiger-1.webp','Ad'],['/work/health/ads/sko-bubbles.webp','Ad'],['/work/health/ads/sko-drippy.webp','Ad']]],
 ['Regulated categories','Telehealth, supplements, peptides and open finance.','We know what Meta, Google and the FDA flag, and we write claims that hold up.',['Compliant claims','Account health','Landing pages'],['$1.2M+','A month in sales for a telehealth brand'],[['/work/health/ads/sko-purest.webp','Ad'],['/work/health/ads/ugc-hunter-trust.webp','Ad'],['/work/health/ads/sko-freevial.webp','Ad']]],
 ['Oversight','Agencies and vendors, held to the numbers.','Scope, cost and results reviewed every month. If something is not earning its fee, you hear it from us first.',['Vendor reviews','Spend audits','Reporting'],['Monthly','Every vendor reviewed against results'],[['/work/yt/HZ7PAyCDwEg.webp','Universal · Hobbs & Shaw'],['/work/yt/zEvYcxW_QP4.webp','LG · G7 ThinQ'],['/work/yt/h4Rb4tDK1GQ.webp','Dtravel']]],
 ['Audience research','Who buys, and why.','Where demand already exists, what moves it, and which creators and fan communities drive it.',['Buyer research','Creator maps','Fan data'],['267','Sports creators measured in our Fan Map'],[['/work/yt/6K0o-VQpIXU.webp','NEAR × SailGP'],['/work/yt/jr3UYpx8gVI.webp','SailGP'],['/work/brands/toyota-imagine.webp','Toyota · Imagine']]],
];
document.getElementById('stack').innerHTML=S.map(([t,lead,body,tags,[pn,pl],imgs],i)=>`
<article class="card" style="--i:${i}">
  <div class="txt">
    <span class="mono n">${String(i+1).padStart(2,'0')} / 09</span>
    <h3>${t}</h3>
    <p class="lead">${lead}</p>
    <p class="body">${body}</p>
    <div class="tags">${tags.map(x=>`<span>${x}</span>`).join('')}</div>
    <div class="proof"><b>${pn}</b><span>${pl}</span></div>
  </div>
  <div class="work">${imgs.map(([s,c])=>`<figure><img src="${s}" alt="${c}" loading="lazy"><figcaption>${c}</figcaption></figure>`).join('')}</div>
</article>`).join('');
// cards behind the top one shrink and dim a little, so the stack reads as depth
const cards=[...document.querySelectorAll('.card')];
const tick=()=>{cards.forEach((c,i)=>{const nx=cards[i+1];if(!nx){c.style.transform='';c.style.filter='';return}
  const r=nx.getBoundingClientRect(),top=parseFloat(getComputedStyle(nx).top),k=Math.min(1,Math.max(0,1-(r.top-top)/innerHeight));
  c.style.transform=`scale(${1-k*.05})`;c.style.filter=`brightness(${1-k*.08})`})};
if(!matchMedia('(prefers-reduced-motion: reduce)').matches){addEventListener('scroll',()=>requestAnimationFrame(tick),{passive:true});tick()}
</script>
</body></html>
