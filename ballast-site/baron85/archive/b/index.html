<style>
:root{--paper:#F3ECDC;--card:#ECE3CD;--ink:#17140F;--soft:#6E6555;--rule:#D8CDB4;--royal:#1F4FD1;
  --stamp:"Graduate",Georgia,serif;--type:"Courier Prime",ui-monospace,Menlo,monospace;--sans:"Archivo","Helvetica Neue",Arial,sans-serif}
@property --r{syntax:"<percentage>";inherits:false;initial-value:0%}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans)}
a{color:inherit}
.page{height:100vh;min-height:640px;display:grid;grid-template-rows:auto 1fr auto;padding:22px 34px 12px;gap:10px;overflow:hidden}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}

.head p{font-family:var(--type);font-size:14px;color:var(--soft);margin:6px 0 0}
.head nav{display:flex;gap:20px;font-size:14px;align-items:center}
.head nav a{text-decoration:none;color:var(--soft)}.head nav a:hover{color:var(--ink)}
.head nav img{width:40px;height:40px;mix-blend-mode:multiply}
.folio{display:grid;grid-template-columns:minmax(260px,24fr) minmax(0,40fr) minmax(280px,30fr);gap:clamp(18px,2.4vw,40px);min-height:0;align-items:center}
/* text */
.text{align-self:center;max-height:100%;overflow:auto;padding-right:6px;scrollbar-width:thin}
.text .kick{font-family:var(--type);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--royal);margin:0 0 12px}
.text .body{font-size:clamp(14.5px,1.02vw,16.5px);line-height:1.62;text-align:justify;hyphens:auto;margin:0}
.text .body::first-letter{font-family:var(--stamp);float:left;font-size:4.6em;line-height:.8;margin:.06em .1em 0 0;color:var(--royal)}
.kw{color:var(--royal);text-decoration:none;border-bottom:1px solid rgba(31,79,209,.35);cursor:pointer}

.text .nx{display:block;margin-top:16px;text-align:right;font-family:var(--type);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--royal);text-decoration:none;cursor:pointer;background:none;border:0;padding:0;width:100%}
.text .nx:hover{text-decoration:underline}
.fade{animation:fade .45s ease both}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.tile{cursor:pointer}

.tile .frame{fill:none;stroke:var(--ink);stroke-width:3}
.tile.lit .frame{stroke:var(--royal);stroke-width:5}
.tile.on .frame{stroke:var(--royal);stroke-width:8}

.pager{display:flex;justify-content:center;align-items:center;gap:16px;font-family:var(--type);font-size:15px;color:var(--royal);height:34px}
.pager button{font:inherit;font-size:22px;line-height:1;color:var(--royal);background:none;border:0;cursor:pointer;padding:0 6px}

.mag{align-self:center}
.mframe{position:relative;border:3px solid var(--ink);background:var(--paper)}
.mframe .mb{height:40px;background:var(--royal);color:var(--paper);font-family:var(--stamp);font-size:17px;display:flex;align-items:center;padding:0 14px 0 60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mhint{font-family:var(--type);font-size:12px;color:var(--soft);text-align:center;margin-top:3px;min-height:16px}
svg.leaders{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:5}
svg.leaders line{stroke:var(--royal);stroke-width:1.6}
svg.leaders.preview line{stroke-dasharray:5 5}
.foot{font-family:var(--type);font-size:12px;color:var(--soft);display:flex;justify-content:space-between;gap:12px}
@media (max-width:1100px){
  .page{height:auto;overflow:visible;padding:16px}

  .letter{order:1}.mag{order:2}.text{order:3;max-height:none;overflow:visible}
  .letter svg{height:auto;width:min(100%,560px)}
  svg.leaders{display:none}
  .head nav a{display:none}
}

<script>
const CH = [{"n": 1, "title": "South Central", "when": "1979", "art": "c01a", "cap": "Telling it himself", "yr": "1979", "text": "Baron Walter Louis Davis was born in Los Angeles on April 13, 1979, and grew up in South Central. The person who raised him was his grandmother and guardian, [[Lela Nicholson]], and she is the one who put a basketball in front of him and kept it there. His grandparents' house sat on [[85th Street]]. He would carry that address a long way: thirty-two years after he was born, in Cleveland, he asked for No. 85 and wore it for his grandparents. She also looked past the neighborhood for his schooling and steered him toward a private school across the city, in Santa Monica, called Crossroads. Everything that follows starts with that decision, and with that house.", "next": "Crossroads"}, {"n": 2, "title": "Crossroads", "when": "1997", "art": "c02a", "cap": "Back in the Crossroads stands", "yr": "1997", "text": "At Crossroads he became the best high school player in the country. As a senior he took the team to Myrtle Beach for the Beach Ball Classic, beat Simon Gratz of Philadelphia in the final, and left with the tournament's MVP. The honors piled up in 1997: [[Gatorade National Player of the Year]], California's Mr. Basketball, a first-team Parade All-American and a McDonald's All-American. At the McDonald's game in Colorado Springs he shared the floor with Elton Brand, Shane Battier, Larry Hughes and Ron Artest. Kansas, Georgia Tech and Duke all came for him. He chose to stay home, where his family and friends could watch. Two decades on he is still in the building: [[on his feet in the stands|c02b]] at a Crossroads playoff game, for the kids now wearing his old school's name.", "next": "UCLA", "fit": "xMidYMin slice"}, {"n": 3, "title": "UCLA", "when": "1997–1999", "art": "c03a", "cap": "Above the rim in Bruin blue", "yr": "1997–99", "text": "He arrived at UCLA [[playing above the rim|c03a]] and was Pac-10 Freshman of the Year at once. Then, in an NCAA Tournament game, he came down from a dunk and tore the ACL in his knee. For a guard whose game was built on speed and lift, it was the kind of injury that ends stories. His didn't. He came back for his sophomore season better than he left: [[first-team All-Pac-10|c03b]] and a third-team Associated Press All-American. Over two seasons in Westwood he averaged 13.6 points and 5.1 assists. After that second year, healthy and rising, he declared for the 1999 NBA draft.", "next": "No. 3"}, {"n": 4, "title": "No. 3", "when": "1999–2001", "art": "c04a", "cap": "Charlotte, No. 1", "yr": "1999", "text": "The [[Charlotte Hornets|c04a]] took him with the third pick of the 1999 draft, and he pulled on No. 1. His first year was an apprenticeship behind Eddie Jones and David Wesley: 82 games, not one start, 5.9 points and 3.8 assists in under nineteen minutes a night. His debut was a 100–86 win over Orlando. The next season the job was his. He [[started all 82 games|c04b]] and averaged 13.8 points, 7.3 assists, 5.0 rebounds and 2.1 steals, and the Hornets swept Miami in the first round before Ray Allen's Bucks beat them in seven.", "next": "89 feet"}, {"n": 5, "title": "89 feet", "when": "February 2001", "art": "c05a", "cap": "All-Star weekend, 2001", "yr": "2001", "text": "February 2001 belonged to him. At All-Star weekend he played in the [[rookie-sophomore game|c05b]] and flew in the [[Slam Dunk Contest|c05a]]. Then, on February 17, at the Bradley Center in Milwaukee, with 0.7 seconds left in the third quarter, he let it go from [[89 feet]], nearly the full length of the floor, and it went in. It is credited as the longest shot ever made in an NBA game, and a quarter of a century later it still is. That spring the Bucks ended his season, too, in seven games in the second round.", "next": "All-Star"}, {"n": 6, "title": "All-Star", "when": "2002–2004", "art": "c06a", "cap": "Charlotte, in the open floor", "yr": "2002–04", "text": "In 2001–02 he started all 82 games again, averaged 18.1 points and 8.5 assists, and made his first All-Star Game as a replacement for Vince Carter. That summer the franchise moved to [[New Orleans]]. Injuries cost him 32 games in 2002–03, but Allen Iverson, whose 76ers ended the Hornets' season, later called him the hardest defensive assignment of his career. In 2003–04 he averaged 22.9 points, [[led the league in steals]] at 2.4 a game, made a second All-Star team and the All-NBA Third Team, and won the Skills Challenge. The Hornets made the playoffs in all five of his seasons, and got past the first round only in the two years he started every game.", "next": "Golden State"}, {"n": 7, "title": "Golden State", "when": "2005", "art": "c07a", "cap": "No. 5, Golden State", "yr": "2005", "text": "On February 24, 2005, New Orleans traded him to Golden State for Speedy Claxton and Dale Davis, and he was back in California, where he had wanted to be since UCLA. He took [[No. 5|c07a]]. The Warriors had not seen the playoffs since 1994, and the first two seasons under Mike Montgomery went the same way. In 2006 the team hired [[Don Nelson|c07b]]. Davis ran the point beside Jason Richardson, and by 2008 [[NBA Access|c07c]] was making a feature about him.", "next": "One Shot"}, {"n": 8, "title": "One Shot", "when": "The Warriors years", "art": "c08a", "cap": "One Shot, Reebok Entertainment", "yr": "Warriors", "text": "Off the court he was already working in film. Reebok Entertainment's short film One Shot, a film by Emmanuelle Chriqui, stars Baron Davis as Sam: a tank top, a headband, a [[boombox|c08a]] on his shoulder and [[roller skates|c08b]], alone on an [[empty schoolyard court|c08c]], shot in black and white. Sam does not dunk on anyone. He skates, he shoots, he shrugs at the camera, and the last thing on screen is the boombox, alone on a bench. It is a basketball film about the feeling of the game rather than the score.", "next": "8 over 1"}, {"n": 9, "title": "8 over 1", "when": "2007", "art": "c09a", "cap": "Oracle Arena, in yellow", "yr": "2007", "text": "In 2006–07 he played through knee soreness and surgery, averaged 20.1 points, led the league in steals again and took the Warriors to their first playoffs since 1994. Dallas had won 67 games; Golden State had won 42. The Warriors won Game 1 in Dallas, 97–85, with 33 from him, and he scored 33 again in a 103–99 win in Game 4 at Oracle Arena, in front of the biggest paying crowd that building had ever held for an NBA game, many of them in [[yellow T-shirts that read WE BELIEVE|c09a]]. On May 3, at home, Stephen Jackson hit a franchise-record seven threes and the Warriors closed it out 111–86. They were the first No. 8 seed to win a best-of-seven series. He averaged 25 points against Dallas, and Steve Kerr, calling it on television, said his play was “outrageous… stunningly athletic and creative and explosive.” [[Oakland lost its mind|c09b]].", "next": "Over Kirilenko"}, {"n": 10, "title": "Over Kirilenko", "when": "May 11, 2007", "art": "c10a", "cap": "Game 3 against Utah", "yr": "2007", "text": "Second round, Game 3, Oracle Arena, the Warriors down 2–0 to Utah. Late in the fourth, with the game already theirs, he took the ball into the lane and [[went up over Andrei Kirilenko|c10b]], six inches taller, and threw it down. Then he stood there. He [[tugged at his jersey|c10c]] with Stephen Jackson beside him and the building shaking, and [[flexed|c10a]] for the cameras. He finished with 32 points and 9 assists in a 125–105 win. Utah took the series in five, but across those playoffs he averaged 25.3 points, 6.5 assists, 4.5 rebounds and 2.9 steals, and the dunk outlived the result.", "next": "Home"}, {"n": 11, "title": "Home", "when": "2008–2011", "art": "c11b", "cap": "Celtics 90, Clippers 92", "yr": "2008–11", "text": "He played all 82 games in 2007–08 and averaged 21.8 points and 7.6 assists, and the Warriors won 48 games and still missed the playoffs. On June 30, 2008, he opted out of $17.8 million and went home: five years and $65 million from the Los Angeles Clippers, signed on July 10. Elton Brand, whom he had planned to play beside, left for Philadelphia, and the Clippers won 19 games. He passed 5,000 career assists on November 20, 2009, and that December he [[beat Boston at the buzzer|c11c]], 92–90, with 24 points, 13 assists and 3 steals. He played alongside Eric Gordon, DeAndre Jordan and Blake Griffin. On February 24, 2011, the Clippers traded him to Cleveland with a first-round pick, the pick that became [[Kyrie Irving]].", "next": "85"}, {"n": 12, "title": "85", "when": "2011–2012", "art": "c12a", "cap": "The work back, 2014", "yr": "2011–12", "text": "In Cleveland he played for Byron Scott again and wore [[No. 85]], for his grandparents' house on 85th Street. The Cavaliers had the worst record in the league and a 26-game losing streak behind them; he helped them win games anyway, including a 102–90 upset of LeBron James's Heat. Released under the amnesty clause that December, he picked the Knicks over the Lakers and the Heat while carrying a herniated disk, and became the starter when Jeremy Lin's season ended. On May 6, 2012, in Game 4 against Miami, his right knee gave way as he dribbled. He was carted off on a stretcher: the ACL and MCL torn, the patellar tendon partly torn. [[The work back|c12b]] went on for years.", "next": "The Drew"}, {"n": 13, "title": "The Drew", "when": "2015–2018", "art": "c13a", "cap": "The Drew League", "yr": "2015–18", "text": "He came back to the game where it is played for love. In July 2015 he scored 44 points in [[the Drew League|c13a]], the summer league he made a documentary about, The Drew: No Excuse, Just Produce. The next January he signed with the NBA Development League; Delaware traded for him in March, and in six games he averaged 12.8 points. In 2017 he played in the NBA Celebrity All-Star Game. In June 2018 he debuted in the BIG3 for 3's Company with 17 points and 9 rebounds in a 21-point win. At the Drew he also [[took on Marvin Bagley|c13b]], then the top high school player in the country.", "next": "The builder"}, {"n": 14, "title": "The builder", "when": "2005–2021", "art": "c14a", "cap": "At the Sundance Film Festival", "yr": "2005–21", "text": "The second career was underway long before the first one ended. Verso Entertainment, with Cash Warren, in 2005. A producer on Stacy Peralta's Crips and Bloods: Made in America, narrated by Forest Whitaker, nominated for an Emmy for Best Documentary and an NAACP Image Award. [[On the festival circuit|c14a]] and [[in front of the camera|c14b]] as well as behind it. 5 Balloons Interactive in 2012, with Sean O'Brien from EA Sports, whose first game was Getting Buckets. Black Santa Company in 2016, to put African American stories and figures on shirts, beanies and Christmas ornaments. An adviser to Tinley Beverage in 2019 and an investor in Metropolis in 2021.", "next": "On air"}, {"n": 15, "title": "On air", "when": "2017–2025", "art": "c15a", "cap": "Dancing with the Stars, 2025", "yr": "2017–25", "text": "Since 2017 he has been a regular voice on TNT's Players Only. His own scripted sitcom, [[WTF, Baron Davis|c15b]], premiered on Fuse on January 20, 2019. There are roles in That's My Boy, The Night Before, Sin City Saints, Mozart in the Jungle and Joy Ride, and he is the voice of Stedmund the horse on TripTank. In 2025 he danced on season 34 of [[Dancing with the Stars|c15a]] and became the host of the Las Vegas Raiders' interview series, Talk of the Nation.", "next": "Now"}, {"n": 16, "title": "Now", "when": "History of the Game", "art": "ball", "cap": "Official archive ball, No. 001", "yr": "Now", "text": "Every moment on this page still plays somewhere: the dunk over Kirilenko, the yellow shirts, the skates and the boombox, the Drew League summers. Most of it lives on other people's channels, cut and recut, watched millions of times, and almost none of it leads back to the man in it. History of the Game brings those moments [[into one archive|../]], gives each one a number, and points every one of them home to him.", "next": null}], CAP = {"c01a": "In conversation", "c02a": "Back in the Crossroads stands", "c02b": "On his feet for Crossroads", "c03a": "UCLA, above the rim", "c03b": "Back from the knee", "c04a": "Charlotte, No. 1", "c04b": "Charlotte against Boston", "c05a": "The Slam Dunk Contest", "c05b": "Rookie-sophomore game, Washington", "c06a": "Charlotte, in the open floor", "c07a": "No. 5, Golden State", "c07b": "Don Nelson", "c07c": "NBA Access, 2008", "c08a": "One Shot", "c08b": "On skates", "c08c": "The empty court", "c09a": "Oracle Arena, in yellow", "c09b": "We Believe", "c10a": "After the dunk", "c10b": "Game 3, late in the fourth", "c10c": "Utah 99, Golden State 119", "c11a": "Los Angeles, 2014", "c12a": "The work back, 2014", "c12b": "Rehab, 2014", "c13a": "The Drew League", "c13b": "Against Marvin Bagley", "c14a": "Sundance Film Festival", "c14b": "In front of the camera", "c15a": "Talking Dancing with the Stars", "c15b": "Talking WTF, Baron Davis", "ball": "Official archive ball, No. 001", "c11b": "Celtics 90, Clippers 92", "c11c": "0.3 seconds left, Los Angeles, December 2009"};
const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plate = (id, k) => `p/${id}_${k}.jpg`;
// The letter: a stem of five panels, two bowls of three, a waist, a top and a bottom bar; the ball in the lower counter.
const UP = {cx: 570, cy: 330, r: 120, R: 290}, LO = {cx: 600, cy: 960, r: 140, R: 320};
const rad = d => d * Math.PI / 180, pt = (c, r, a) => [c.cx + r * Math.cos(rad(a)), c.cy + r * Math.sin(rad(a))];
const rect = (x0, y0, x1, y1) => ({d: `M${x0},${y0}H${x1}V${y1}H${x0}Z`, box: [x0, y0, x1, y1], kind: "rect"});
function sector(c, a0, a1){
  const [x0, y0] = pt(c, c.R, a0), [x1, y1] = pt(c, c.R, a1), [x2, y2] = pt(c, c.r, a1), [x3, y3] = pt(c, c.r, a0);
  const xs = [], ys = []; for (let a = a0; a <= a1; a += 2) for (const r of [c.r, c.R]){ const [x, y] = pt(c, r, a); xs.push(x); ys.push(y); }
  return {d: `M${x0},${y0}A${c.R},${c.R} 0 0 1 ${x1},${y1}L${x2},${y2}A${c.r},${c.r} 0 0 0 ${x3},${y3}Z`, box: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)], kind: "sector", c, a0, a1};
}
const circle = (c, r) => ({d: `M${c.cx - r},${c.cy}a${r},${r} 0 1 0 ${2 * r},0a${r},${r} 0 1 0 ${-2 * r},0`, box: [c.cx - r, c.cy - r, c.cx + r, c.cy + r], kind: "circle"});

const STEM = [rect(40, 40, 330, 288), rect(40, 288, 330, 536), rect(40, 536, 330, 784), rect(40, 784, 330, 1032), rect(40, 1032, 330, 1280)];

const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };

function build(){

  el("circle", {cx: UP.cx, cy: UP.cy, r: UP.r - 12, fill: "none", stroke: "#17140F", "stroke-width": 2}, svg);
  const rt = el("text", {class: "orn"}, svg), tp = el("textPath", {href: "#ring"}, rt); tp.textContent = "CHARLOTTE · NEW ORLEANS · OAKLAND · LOS ANGELES · CLEVELAND · NEW YORK ·";
  const nb = el("text", {class: "ornb", x: UP.cx, y: UP.cy + 12, "text-anchor": "middle", "font-size": 34}, svg); nb.textContent = "1 · 5 · 85";
  SHAPES.forEach((s, k) => {
    const ch = CH[k], g = el("g", {class: "tile", tabindex: 0, role: "button", "aria-label": `§${ch.n} ${ch.title}, ${ch.when}`}, svg); g.dataset.k = k;
    el("clipPath", {id: "c" + k}, defs).appendChild(el("path", {d: s.d}));
    el("path", {d: s.d, fill: "#F3ECDC"}, g);
    const [x0, y0, x1, y1] = s.box, w = x1 - x0, h = y1 - y0, fit = ch.art === "ball" ? "xMidYMid meet" : ch.fit || "xMidYMid slice";
    el("image", {href: plate(ch.art, "ink"), x: x0, y: y0, width: w, height: h, preserveAspectRatio: fit, "clip-path": `url(#c${k})`, class: "ink"}, g);
    el("image", {href: plate(ch.art, "col"), x: x0, y: y0, width: w, height: h, preserveAspectRatio: fit, "clip-path": `url(#c${k})`, class: "col"}, g);
    if (s.kind === "rect"){ el("rect", {class: "band", x: x0, y: y0, width: w, height: 30}, g); const t = el("text", {class: "bandt", x: x0 + 50, y: y0 + 21}, g); t.textContent = `${ch.title.toUpperCase()} · ${ch.yr}`; }
    if (s.kind === "sector"){
      const c = s.c, rb = c.R - 17, [ax, ay] = pt(c, rb, s.a0 + 3), [bx, by] = pt(c, rb, s.a1 - 3), flip = (s.a0 + s.a1) / 2 > 15;
      el("path", {d: `M${pt(c, c.R, s.a0)}A${c.R},${c.R} 0 0 1 ${pt(c, c.R, s.a1)}L${pt(c, c.R - 34, s.a1)}A${c.R - 34},${c.R - 34} 0 0 0 ${pt(c, c.R - 34, s.a0)}Z`, class: "band"}, g);
      el("path", {id: "arc" + k, d: flip ? `M${bx},${by}A${rb},${rb} 0 0 0 ${ax},${ay}` : `M${ax},${ay}A${rb},${rb} 0 0 1 ${bx},${by}`, fill: "none"}, defs);
      const t = el("text", {class: "bandt", dy: flip ? -5 : 5, "font-size": 13}, g), p = el("textPath", {href: "#arc" + k, startOffset: flip ? "43%" : "57%", "text-anchor": "middle"}, t); p.textContent = `${ch.title.toUpperCase()} · ${ch.yr}`;
    }
    el("path", {d: s.d, class: "frame"}, g);
    const [bx, by] = s.kind === "sector" ? pt(s.c, s.c.R - 17, s.a0 + 6.5) : s.kind === "circle" ? [x0 + 30, y0 + 30] : [x0 + 24, y0 + 15];
    const b = el("g", {class: "badge"}, g); el("circle", {cx: bx, cy: by, r: 19}, b); const bt = el("text", {x: bx, y: by + 7, "text-anchor": "middle"}, b); bt.textContent = ch.n;
    if (read.has(k)) g.classList.add("read");
    g.addEventListener("mouseenter", () => preview(k)); g.addEventListener("mouseleave", () => preview(null));
    g.addEventListener("click", () => go(k)); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go(k); } });
    TILES[k] = g;
  });
}
// text: [[word|frame]] brings up that frame; [[word]] is a rubric word; [[word|../]] links out
const render = t => esc(t).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, a, r) => !r ? `<b class="kw0">${a}</b>` : /^c\d|^ball/.test(r) ? `<a class="kw" data-f="${r}" tabindex="0">${a}</a>` : `<a class="kw" href="${r}">${a}</a>`);
let cur = 0, shown = null, pinned = null;
function show(frame, mode){
  // mode: "read" paints it in; "preview" draws it in ink
  const mi = $("mi"), mc = $("mc");
  mi.src = plate(frame, "ink"); mc.src = plate(frame, "col");
  mi.classList.remove("draw"); mc.classList.remove("paint", "shown"); void mi.offsetWidth;
  if (mode === "read"){ mc.classList.add(shown === frame ? "shown" : "paint"); } else { mi.classList.add("draw"); }
  shown = mode === "read" ? frame : null;
  $("mcap").textContent = `§${CH[mode === "preview" ? hov : cur].n} · ${CAP[frame] || ""}`;
}
let hov = null;
function preview(k){
  hov = k;
  TILES.forEach((t, j) => t.classList.toggle("lit", j === k));
  if (k === null || k === cur){ hov = null; restore(); return; }
  const c = CH[k]; $("mbadge").textContent = c.n; $("mb").textContent = c.title; show(c.art, "preview");
  $("mhint").textContent = "Click the compartment to read this chapter"; $("leaders").classList.add("preview"); leaders(k);
}
function restore(){
  const c = CH[cur]; $("mbadge").textContent = c.n; $("mb").textContent = c.title; show(pinned || c.art, "read");
  $("mhint").textContent = ""; $("leaders").classList.remove("preview"); leaders(cur);
}
function go(k){
  cur = (k + CH.length) % CH.length; pinned = null; hov = null; const c = CH[cur];
  read.add(cur); save();
  TILES.forEach((t, j) => { t.classList.toggle("on", j === cur); t.classList.toggle("read", read.has(j)); t.classList.remove("lit"); });
  const on = TILES[cur]; on.parentNode.appendChild(on);
  $("pg").textContent = `${c.n} / ${CH.length}`;
  const nx = CH[cur + 1];
  $("text").innerHTML = `<div class="fade"><p class="kick">§${c.n} · ${esc(c.title)} · ${esc(c.when)}</p><p class="body">${render(c.text)}</p>
    <button class="nx" id="nx">${nx ? `§${nx.n} · ${esc(nx.title)} →` : "§1 · South Central →"}</button></div>`;
  $("nx").onclick = () => go(cur + 1);
  shown = null; restore();
  history.replaceState(null, "", "#" + c.n);
}
// key words: hover shows their frame, click keeps it
$("text").addEventListener("mouseover", e => { const a = e.target.closest(".kw[data-f]"); if (a && !hov){ show(a.dataset.f, "read"); $("mcap").textContent = `§${CH[cur].n} · ${CAP[a.dataset.f]}`; } });
$("text").addEventListener("mouseout", e => { const a = e.target.closest(".kw[data-f]"); if (a && !hov) show(pinned || CH[cur].art, "read"); });
$("text").addEventListener("click", e => { const a = e.target.closest(".kw[data-f]"); if (!a) return; e.preventDefault();
  pinned = pinned === a.dataset.f ? null : a.dataset.f; document.querySelectorAll(".kw.on").forEach(x => x.classList.remove("on")); if (pinned) a.classList.add("on"); show(pinned || CH[cur].art, "read"); });
// leader lines from the compartment to the magnifier
function leaders(k){
  const L = $("leaders"); if (innerWidth <= 1100 || k === null) return;
  const f = TILES[k].querySelector(".frame").getBoundingClientRect(), m = $("mframe").getBoundingClientRect();
  const set = (id, x1, y1, x2, y2) => { const l = $(id); l.setAttribute("x1", x1); l.setAttribute("y1", y1); l.setAttribute("x2", x2); l.setAttribute("y2", y2); };
  set("l1", f.right, f.top, m.left, m.top); set("l2", f.right, f.bottom, m.left, m.bottom);
}
build();
$("prev").onclick = () => go(cur - 1); $("next").onclick = () => go(cur + 1);
addEventListener("keydown", e => { if (e.key === "ArrowRight") go(cur + 1); if (e.key === "ArrowLeft") go(cur - 1); });
addEventListener("resize", () => leaders(hov ?? cur));
document.fonts && document.fonts.ready.then(() => leaders(cur));
CH.forEach(c => { const i = new Image(); i.src = plate(c.art, "col"); });
go(Math.max(0, Math.min(CH.length - 1, (parseInt(location.hash.slice(1)) || 1) - 1)));
</script>
