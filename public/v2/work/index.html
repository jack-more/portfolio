:root{--ink:#0A0D18;--mute:#7C8597;--grid:#EEF0F4;--cob:#0076B6;--or:#F86608;--sky:#B8C7D9}
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:var(--ink)}
body{font:500 11px/1.5 Geist,"Helvetica Neue",Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
.wm{font-family:"Ballast Display",Geist,sans-serif;font-style:italic;text-transform:none;letter-spacing:-.02em;line-height:.8}

.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px 24px}

.foot{text-align:center;padding:22px}
.work{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto}
.folders{align-self:center;display:flex;flex-wrap:wrap;justify-content:center;gap:34px 26px;max-width:1240px;margin:0 auto;padding:40px 24px}
.fd{display:grid;justify-items:center;gap:12px;width:122px}
.fd .f{position:relative;width:122px;height:96px;transition:transform .2s}
.fd .f::before{content:"";position:absolute;left:0;top:0;width:46%;height:24px;border-radius:9px 9px 0 0;background:var(--c);filter:brightness(.82)}
.fd .f i{position:absolute;left:0;right:0;bottom:0;top:12px;border-radius:7px 9px 9px 9px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 40%),var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px rgba(10,13,24,.12);display:grid;place-items:center}
.fd .f img{max-width:62%;max-height:40%;filter:brightness(0) invert(1)}
.fd .f b{font:italic 400 30px "Ballast Display",Geist;color:#fff;letter-spacing:-.02em;text-transform:none}
.fd:hover .f{transform:translateY(-3px)}.fd span{text-align:center}
